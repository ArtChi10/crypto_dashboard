{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Crypto Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{% url 'dashboard:home' %}">Crypto Dashboard</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'dashboard:home' %}">Dashboard</a>
                <a href="{% url 'dashboard:upload' %}">Upload CSV</a>
                <a href="{% url 'runs:list' %}">Runs</a>
                <a href="/admin/">Admin</a>
            </nav>
        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

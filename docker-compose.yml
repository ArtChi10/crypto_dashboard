services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crypto_dashboard
      POSTGRES_USER: crypto_dashboard
      POSTGRES_PASSWORD: crypto_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_dashboard -d crypto_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: docker-insecure-local-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://crypto_dashboard:crypto_dashboard@db:5432/crypto_dashboard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: >
      sh -c "python manage.py migrate
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

volumes:
  postgres_data:
  media_data:
  static_data:
